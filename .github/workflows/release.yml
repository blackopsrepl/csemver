name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master
        with:
          fetch-depth: 0
      - name: Verify tag and test the release build
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          test "$tag" != "$version"
          test "$(tr -d '\r\n' < VERSION)" = "$version"
          test "$(git log -1 --format=%s "$tag")" = "chore(release): $version"
          make clean test "CSEMVER_VERSION=$version"
          test "$(./build/csemver --version)" = "$version"
      - name: Extract notes from the tagged changelog
        shell: bash
        run: |
          awk '
            /^## / { if (section) exit; section = 1 }
            section { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          grep -F "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
