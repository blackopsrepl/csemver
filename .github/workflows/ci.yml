name: C tests

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.3
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master
      - name: Install libxml2 and libyaml development files on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libyaml-dev pkg-config
      - name: Install libxml2 and libyaml development files on macOS
        if: runner.os == 'macOS'
        run: |
          for formula in libxml2 libyaml pkgconf coreutils; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done
          echo "$(brew --prefix libxml2)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libyaml)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Build and test
        run: make clean test
